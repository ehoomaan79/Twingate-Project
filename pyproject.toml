[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "twingate-zero-trust-backbone"
version = "0.1.0"
description = "Modular zero-trust backbone inspired by Twingate-style private access"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Hoomaan Ebrahimi" }]
license = { text = "MIT" }
keywords = ["zero-trust", "security", "relay", "networking", "python", "ztna"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "License :: OSI Approved :: MIT License",
  "Operating System :: Linux",
  "Topic :: Security :: Cryptography",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "cryptography>=42.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
