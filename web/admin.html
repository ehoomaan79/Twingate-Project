<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ZTNA Control Plane</title><link rel="stylesheet" href="/static/styles.css"></head><body><header><div><h1>Control plane</h1><p>Identity, resource policy, and connector operations</p></div><span class="badge">ADMIN CONSOLE</span></header><main class="shell"><div class="toolbar"><label for="token">Administrator token</label><input id="token" type="password" placeholder="Bearer token"><button id="connect">Open console</button><span id="status" class="muted"></span></div><div id="message"></div><section class="grid"><article class="panel"><h2>Network inventory</h2><div class="grid"><div><div id="usersCount" class="stat">-</div><div class="muted">Users</div></div><div><div id="groupsCount" class="stat">-</div><div class="muted">Groups</div></div><div><div id="resourcesCount" class="stat">-</div><div class="muted">Resources</div></div><div><div id="connectorsCount" class="stat">-</div><div class="muted">Connectors</div></div></div></article><article class="panel"><h2>Issue connector enrollment</h2><label>Connector ID</label><input id="connectorId" placeholder="connector-prod-1"><div class="actions"><button id="issueToken">Generate one-time token</button></div><pre id="issuedToken">No token issued.</pre></article><article class="panel"><h2>Create user</h2><label>User ID</label><input id="userId" placeholder="alice"><label>Groups</label><input id="userGroups" placeholder="engineering,ops"><div class="actions"><button id="createUser">Create user</button></div></article><article class="panel"><h2>Create group</h2><label>Group name</label><input id="groupName" placeholder="engineering"><div class="actions"><button id="createGroup">Create group</button></div></article><article class="panel wide"><h2>Define protected resource</h2><div class="grid"><div><label>Resource ID</label><input id="resourceId" placeholder="internal-api"><label>Address or private domain</label><input id="resourceAddress" placeholder="api.corp.internal or 10.20.0.8"><label>Aliases</label><input id="resourceAliases" placeholder="api,api.internal.example"></div><div><label>Allowed groups</label><input id="resourceGroups" placeholder="engineering"><label>TCP/UDP ports</label><input id="resourcePorts" placeholder="443,22"><label>Connector DNS servers</label><input id="resourceDns" placeholder="10.20.0.53,10.20.0.54"></div></div><div class="actions"><button id="createResource">Create protected resource</button></div></article><article class="panel wide"><h2>Live configuration</h2><div id="tables" class="muted">Connect to load inventory.</div></article></section></main><script src="/static/admin.js"></script></body></html>
